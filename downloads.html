<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DaBingaBongo — Downloads</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --surface-2: #161616;
    --surface-3: #1c1c1c;
    --border: #222;
    --border-strong: #2d2d2d;
    --red: #cc0000;
    --red-bright: #ff3333;
    --green: #00cc00;
    --green-dim: #008a00;
    --green-soft: rgba(0, 200, 0, 0.12);
    --text: #dddddd;
    --text-mid: #aaaaaa;
    --text-dim: #6f6f6f;
    --mono: 'Courier Prime', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Roboto', sans-serif;
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* ── Header ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .stamp {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    color: var(--red);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border: 1px solid var(--red);
    padding: 3px 10px;
    border-radius: 2px;
    opacity: 0.75;
  }

  .back-link {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 0.06em;
  }
  .back-link:hover { color: var(--green); }

  h1 {
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 700;
    letter-spacing: 0.5px;
    margin: 18px 0 4px;
  }
  h1 .blink { color: var(--green); }

  .subtitle {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    margin-bottom: 24px;
  }

  /* ── Controls ── */
  .controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 22px;
  }

  .search-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-box {
    position: relative;
    flex: 1 1 260px;
  }
  .search-box svg {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    width: 15px; height: 15px;
    stroke: var(--text-dim);
    pointer-events: none;
  }
  .search-box input {
    width: 100%;
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    color: var(--text);
    font-size: 14px;
    padding: 11px 12px 11px 34px;
    outline: none;
    font-family: inherit;
  }
  .search-box input:focus { border-color: var(--green-dim); }
  .search-box input::placeholder { color: var(--text-dim); }

  .sort-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sort-wrap label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  select {
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    color: var(--text);
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
    font-family: inherit;
    cursor: pointer;
  }
  select:focus { border-color: var(--green-dim); }

  .filters { margin-top: 14px; }
  .filter-group { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .filter-group:first-child { margin-top: 0; }
  .filter-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    min-width: 62px;
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-mid);
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .chip:hover { color: var(--text); border-color: #3a3a3a; }
  .chip[aria-pressed="true"] {
    background: var(--green-soft);
    border-color: var(--green-dim);
    color: var(--green);
  }

  .count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    margin: 0 2px 12px;
  }

  /* ── Cards ── */
  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card.featured { border-color: var(--green-dim); }
  .card.template {
    border-style: dashed;
    border-color: #3a3a3a;
    background: var(--surface-2);
  }

  .card-head { display: flex; gap: 13px; align-items: flex-start; }
  .icon {
    width: 46px; height: 46px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
  }
  .head-text { min-width: 0; flex: 1; }
  .name-row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .name { font-size: 17px; font-weight: 600; color: #fff; }
  .version {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--green);
    background: var(--green-soft);
    border: 1px solid var(--green-dim);
    border-radius: 5px;
    padding: 1px 7px;
  }
  .badge {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid;
  }
  .badge.feat { color: var(--green); border-color: var(--green-dim); }
  .badge.tmpl { color: var(--red-bright); border-color: var(--red); }
  .tagline { font-size: 13px; color: var(--text-mid); margin-top: 2px; }

  .desc { font-size: 13.5px; color: var(--text-mid); }

  .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pill {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    border: 1px solid var(--border-strong);
    border-radius: 5px;
    padding: 2px 8px;
  }
  .pill.cat { color: var(--text-mid); }
  .updated { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); margin-left: auto; }

  .dl-row { display: flex; gap: 9px; flex-wrap: wrap; }
  .dl-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--green-soft);
    border: 1px solid var(--green-dim);
    color: var(--green);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    transition: background .15s;
  }
  .dl-btn:hover { background: rgba(0, 200, 0, 0.2); }
  .dl-btn .sz { font-family: var(--mono); font-size: 10.5px; color: var(--green-dim); }
  .dl-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }

  .links-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .ext-link {
    font-size: 12.5px;
    color: var(--text-mid);
    text-decoration: none;
    border-bottom: 1px dotted var(--text-dim);
  }
  .ext-link:hover { color: var(--green); border-color: var(--green); }

  .cl-toggle {
    background: none; border: none;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    cursor: pointer;
    padding: 4px 0;
    display: inline-flex; align-items: center; gap: 6px;
    align-self: flex-start;
  }
  .cl-toggle:hover { color: var(--green); }
  .cl-toggle .caret { transition: transform .15s; }
  .cl-toggle[aria-expanded="true"] .caret { transform: rotate(90deg); }

  .changelog {
    border-top: 1px solid var(--border);
    padding-top: 12px;
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .changelog.open { display: flex; }
  .cl-ver { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .cl-ver .v { font-family: var(--mono); font-size: 12px; color: var(--green); font-weight: 700; }
  .cl-ver .d { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); }
  .changelog ul { margin: 0; padding-left: 18px; }
  .changelog li { font-size: 12.5px; color: var(--text-mid); margin: 2px 0; }

  .tmpl-note {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface-3);
    border: 1px dashed var(--border-strong);
    border-radius: 7px;
    padding: 8px 11px;
  }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty .big { font-size: 34px; margin-bottom: 10px; opacity: .5; }
  .empty p { font-family: var(--mono); font-size: 12px; letter-spacing: 0.05em; }

  /* ── Template section ── */
  .tmpl-section { margin-top: 40px; }
  .tmpl-heading {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-top: 1px dashed var(--border-strong);
    padding-top: 20px;
    margin-bottom: 14px;
  }

  .loading { font-family: var(--mono); font-size: 12px; color: var(--text-dim); padding: 40px 4px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <span class="stamp">Restricted Access</span>
      <a href="/login.html" class="back-link">← back to tools</a>
    </div>

    <h1>Downloads<span class="blink">_</span></h1>
    <p class="subtitle">Latest builds of everything I'm shipping — always the current version.</p>

    <div class="controls">
      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="search" type="search" placeholder="Search apps, tags, platforms…" aria-label="Search downloads" autocomplete="off" />
        </div>
        <div class="sort-wrap">
          <label for="sort">Sort</label>
          <select id="sort" aria-label="Sort downloads">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="name-asc">Name (A–Z)</option>
            <option value="name-desc">Name (Z–A)</option>
          </select>
        </div>
      </div>
      <div class="filters" id="filters"></div>
    </div>

    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
    <div id="empty" class="empty" hidden>
      <div class="big">🗂</div>
      <p>No downloads match your filters.</p>
    </div>

    <section class="tmpl-section" id="tmpl-section" hidden>
      <div class="tmpl-heading">＋ Add an app — copy this entry in downloads.json</div>
      <div class="grid" id="tmpl-grid"></div>
    </section>
  </div>

  <script>
    // ── Soft gate (matches the other internal tools) ──
    if (!sessionStorage.getItem('dbb_tools_auth')) {
      window.location.replace('/login.html');
    }

    const state = { items: [], templates: [], search: '', sort: 'newest', types: new Set(), platforms: new Set() };

    const el = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    };

    const fmtDate = (iso) => {
      if (!iso) return '';
      const d = new Date(iso + 'T00:00:00');
      if (isNaN(d)) return iso;
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    };

    const isExternal = (url) => /^https?:\/\//i.test(url || '');

    async function load() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '<p class="loading">Loading downloads…</p>';
      try {
        const res = await fetch('/downloads.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('fetch failed');
        const data = await res.json();
        const all = Array.isArray(data.items) ? data.items.filter(Boolean) : [];
        state.items = all.filter((i) => !i.template);
        state.templates = all.filter((i) => i.template);
        grid.innerHTML = '';
        buildFilters();
        render();
        renderTemplates();
      } catch (e) {
        grid.innerHTML = '<p class="loading">Couldn\'t load downloads.json — check the manifest.</p>';
      }
    }

    function uniq(list) { return [...new Set(list)]; }

    function buildFilters() {
      const cats = uniq(state.items.map((i) => i.category).filter(Boolean)).sort();
      const plats = uniq(state.items.flatMap((i) => i.platforms || [])).sort();
      const host = document.getElementById('filters');
      host.innerHTML = '';
      if (cats.length > 1) host.appendChild(chipGroup('Type', cats, state.types));
      if (plats.length > 1) host.appendChild(chipGroup('Platform', plats, state.platforms));
    }

    function chipGroup(label, values, selectedSet) {
      const group = el('div', 'filter-group');
      group.appendChild(el('span', 'filter-label', label));
      const chips = el('div', 'chips');
      values.forEach((v) => {
        const b = el('button', 'chip', v);
        b.type = 'button';
        b.setAttribute('aria-pressed', 'false');
        b.addEventListener('click', () => {
          if (selectedSet.has(v)) { selectedSet.delete(v); b.setAttribute('aria-pressed', 'false'); }
          else { selectedSet.add(v); b.setAttribute('aria-pressed', 'true'); }
          render();
        });
        chips.appendChild(b);
      });
      group.appendChild(chips);
      return group;
    }

    function matches(item) {
      if (state.types.size && !state.types.has(item.category)) return false;
      if (state.platforms.size) {
        const p = item.platforms || [];
        if (![...state.platforms].every((f) => p.includes(f))) return false;
      }
      const q = state.search.trim().toLowerCase();
      if (q) {
        const hay = [item.name, item.tagline, item.description, item.category,
          (item.platforms || []).join(' '), (item.tags || []).join(' ')].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }

    function sortItems(list) {
      const by = state.sort;
      const arr = [...list];
      arr.sort((a, b) => {
        if (by === 'name-asc') return a.name.localeCompare(b.name);
        if (by === 'name-desc') return b.name.localeCompare(a.name);
        const da = a.updated || '', db = b.updated || '';
        return by === 'oldest' ? da.localeCompare(db) : db.localeCompare(da);
      });
      // Featured pinned to the top (keeps their relative sorted order).
      arr.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
      return arr;
    }

    function render() {
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');
      const count = document.getElementById('count');
      const visible = sortItems(state.items.filter(matches));

      grid.innerHTML = '';
      const total = state.items.length;
      count.textContent = visible.length === total
        ? `${total} download${total === 1 ? '' : 's'}`
        : `${visible.length} of ${total} download${total === 1 ? '' : 's'}`;

      empty.hidden = visible.length !== 0;
      visible.forEach((item) => grid.appendChild(card(item)));
    }

    function renderTemplates() {
      const section = document.getElementById('tmpl-section');
      const grid = document.getElementById('tmpl-grid');
      if (!state.templates.length) { section.hidden = true; return; }
      section.hidden = false;
      grid.innerHTML = '';
      state.templates.forEach((item) => grid.appendChild(card(item, true)));
    }

    function card(item, isTemplate) {
      const c = el('div', 'card' + (item.featured ? ' featured' : '') + (isTemplate ? ' template' : ''));

      // Head
      const head = el('div', 'card-head');
      head.appendChild(el('div', 'icon', item.icon || '📦'));
      const ht = el('div', 'head-text');
      const nameRow = el('div', 'name-row');
      nameRow.appendChild(el('span', 'name', item.name || 'Untitled'));
      if (item.version) nameRow.appendChild(el('span', 'version', 'v' + item.version));
      if (isTemplate) nameRow.appendChild(el('span', 'badge tmpl', 'Template'));
      else if (item.featured) nameRow.appendChild(el('span', 'badge feat', 'Featured'));
      ht.appendChild(nameRow);
      if (item.tagline) ht.appendChild(el('div', 'tagline', item.tagline));
      head.appendChild(ht);
      c.appendChild(head);

      if (item.description) c.appendChild(el('div', 'desc', item.description));

      // Meta
      const meta = el('div', 'meta');
      if (item.category) meta.appendChild(el('span', 'pill cat', item.category));
      (item.platforms || []).forEach((p) => meta.appendChild(el('span', 'pill', p)));
      if (item.updated) meta.appendChild(el('span', 'updated', 'Updated ' + fmtDate(item.updated)));
      c.appendChild(meta);

      if (isTemplate) {
        c.appendChild(el('div', 'tmpl-note',
          'This card is a reference. Duplicate this object in downloads.json (drop the "template": true flag) to publish a real app.'));
        return c;
      }

      // Downloads
      const dls = (item.downloads || []).filter((d) => d && d.url);
      if (dls.length) {
        const row = el('div', 'dl-row');
        dls.forEach((d) => {
          const a = document.createElement('a');
          a.className = 'dl-btn';
          a.href = d.url;
          if (isExternal(d.url)) { a.target = '_blank'; a.rel = 'noopener'; } else { a.setAttribute('download', ''); }
          a.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>';
          a.appendChild(el('span', null, d.label || 'Download'));
          if (d.size) a.appendChild(el('span', 'sz', d.size));
          row.appendChild(a);
        });
        c.appendChild(row);
      }

      // External links
      const links = (item.links || []).filter((l) => l && l.url);
      if (links.length) {
        const row = el('div', 'links-row');
        links.forEach((l) => {
          const a = document.createElement('a');
          a.className = 'ext-link';
          a.href = l.url;
          a.textContent = l.label || l.url;
          if (isExternal(l.url)) { a.target = '_blank'; a.rel = 'noopener'; }
          row.appendChild(a);
        });
        c.appendChild(row);
      }

      // Changelog
      const cl = (item.changelog || []).filter(Boolean);
      if (cl.length) {
        const toggle = el('button', 'cl-toggle');
        toggle.type = 'button';
        toggle.setAttribute('aria-expanded', 'false');
        toggle.innerHTML = '<span class="caret">▸</span>';
        toggle.appendChild(el('span', null, 'Changelog'));
        const panel = el('div', 'changelog');
        cl.forEach((entry) => {
          const ver = el('div', 'cl-ver');
          ver.appendChild(el('span', 'v', 'v' + (entry.version || '?')));
          if (entry.date) ver.appendChild(el('span', 'd', fmtDate(entry.date)));
          const block = el('div');
          block.appendChild(ver);
          const ul = el('ul');
          (entry.notes || []).forEach((n) => ul.appendChild(el('li', null, n)));
          block.appendChild(ul);
          panel.appendChild(block);
        });
        toggle.addEventListener('click', () => {
          const open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        c.appendChild(toggle);
        c.appendChild(panel);
      }

      return c;
    }

    document.getElementById('search').addEventListener('input', (e) => { state.search = e.target.value; render(); });
    document.getElementById('sort').addEventListener('change', (e) => { state.sort = e.target.value; render(); });

    load();
  </script>
</body>
</html>
