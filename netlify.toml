[build]
  command = "bash build.sh"
  publish = "dist"

# The Stroke Off app (built into /strokeoff by build.sh) needs these set in the
# Netlify UI → Site settings → Environment (NOT committed here):
#   VITE_SUPABASE_URL       - Supabase project URL
#   VITE_SUPABASE_ANON_KEY  - Supabase anon/public key
# Without them the app still builds and runs; its Supabase health check just reports
# "not configured" until they're provided.

[[headers]]
  for = "/*"
  [headers.values]
  Access-Control-Allow-Origin = "*"

# Never cache the Stroke Off service worker or web manifest, so the PWA update flow works.
[[headers]]
  for = "/strokeoff/sw.js"
  [headers.values]
  Cache-Control = "no-cache"

[[headers]]
  for = "/strokeoff/manifest.webmanifest"
  [headers.values]
  Cache-Control = "no-cache"

# ---------------------------------------------------------------- The Delve
#
# The Delve (dungeon-crawl authoring tool for the phone adventure) lives in its
# own repo — mikeyd433/PhoneDungeonBuilder — and deploys as its own Netlify
# site. Unlike strokeoff/harmony/brainstorm, it is NOT built by build.sh; it is
# proxied in here so it keeps the dabingabongo.com/delve URL.
#
# status = 200 makes these rewrites rather than redirects, so the address bar
# stays on dabingabongo.com. The Delve is built with Vite base = "/delve/", so
# its own asset paths already line up with this prefix and :splat passes through
# unchanged.
#
# TODO: DELVE_ORIGIN below is a placeholder — point it at the real Netlify site
# for PhoneDungeonBuilder once that site exists, then remove this note.
[[redirects]]
  from = "/delve"
  to   = "https://the-delve.netlify.app/delve/"
  status = 200
  force = true

[[redirects]]
  from = "/delve/*"
  to   = "https://the-delve.netlify.app/delve/:splat"
  status = 200
  force = true

# Short, typeable link for the TouchSynth APK
[[redirects]]
  from = "/touchsynth/apk"
  to   = "/touchsynth/TouchSynth.apk"
  status = 301
  force = true

# Clean URL for the downloads hub (exact match, so /downloads/<file> still serves).
[[redirects]]
  from = "/downloads"
  to   = "/downloads.html"
  status = 301

# SPA fallback for brainstorm app
[[redirects]]
  from = "/brainstorm"
  to   = "/brainstorm/"
  status = 301

[[redirects]]
  from = "/brainstorm/*"
  to   = "/brainstorm/index.html"
  status = 200

# SPA fallback for harmony app
[[redirects]]
  from = "/harmony"
  to   = "/harmony/"
  status = 301

[[redirects]]
  from = "/harmony/*"
  to   = "/harmony/index.html"
  status = 200

# SPA fallback for Stroke Off app (client-side routes resolve on deep link / refresh)
[[redirects]]
  from = "/strokeoff"
  to   = "/strokeoff/"
  status = 301

[[redirects]]
  from = "/strokeoff/*"
  to   = "/strokeoff/index.html"
  status = 200

[[redirects]]
  from = "/songs"
  to   = "/songs/"
  status = 200

[[redirects]]
  from = "/songs/*"
  to   = "/songs/:splat"
  status = 200
  force = true
