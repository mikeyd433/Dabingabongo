[build]
  command = "bash build.sh"
  publish = "dist"

# The Stroke Off app (built into /strokeoff by build.sh) needs these set in the
# Netlify UI → Site settings → Environment (NOT committed here):
#   VITE_SUPABASE_URL       - Supabase project URL
#   VITE_SUPABASE_ANON_KEY  - Supabase anon/public key
# Without them the app still builds and runs; its Supabase health check just reports
# "not configured" until they're provided.

[[headers]]
  for = "/*"
  [headers.values]
  Access-Control-Allow-Origin = "*"

# Never cache the Stroke Off service worker or web manifest, so the PWA update flow works.
[[headers]]
  for = "/strokeoff/sw.js"
  [headers.values]
  Cache-Control = "no-cache"

[[headers]]
  for = "/strokeoff/manifest.webmanifest"
  [headers.values]
  Cache-Control = "no-cache"

# Never cache The Delve's service worker or web manifest, so its PWA update
# flow works — same reasoning as Stroke Off above.
[[headers]]
  for = "/delve/sw.js"
  [headers.values]
  Cache-Control = "no-cache"

[[headers]]
  for = "/delve/manifest.webmanifest"
  [headers.values]
  Cache-Control = "no-cache"

# Short, typeable link for the TouchSynth APK
[[redirects]]
  from = "/touchsynth/apk"
  to   = "/touchsynth/TouchSynth.apk"
  status = 301
  force = true

# Clean URL for the downloads hub (exact match, so /downloads/<file> still serves).
[[redirects]]
  from = "/downloads"
  to   = "/downloads.html"
  status = 301

# SPA fallback for brainstorm app
[[redirects]]
  from = "/brainstorm"
  to   = "/brainstorm/"
  status = 301

[[redirects]]
  from = "/brainstorm/*"
  to   = "/brainstorm/index.html"
  status = 200

# SPA fallback for harmony app
[[redirects]]
  from = "/harmony"
  to   = "/harmony/"
  status = 301

[[redirects]]
  from = "/harmony/*"
  to   = "/harmony/index.html"
  status = 200

# SPA fallback for Stroke Off app (client-side routes resolve on deep link / refresh)
[[redirects]]
  from = "/strokeoff"
  to   = "/strokeoff/"
  status = 301

[[redirects]]
  from = "/strokeoff/*"
  to   = "/strokeoff/index.html"
  status = 200

# SPA fallback for The Delve (built from the PhoneDungeonBuilder repo by
# build.sh), so client-side routes resolve on deep link or refresh.
[[redirects]]
  from = "/delve"
  to   = "/delve/"
  status = 301

[[redirects]]
  from = "/delve/*"
  to   = "/delve/index.html"
  status = 200

[[redirects]]
  from = "/songs"
  to   = "/songs/"
  status = 200

[[redirects]]
  from = "/songs/*"
  to   = "/songs/:splat"
  status = 200
  force = true
